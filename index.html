<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="style.css"
      media="screen"
      charset="utf-8"
    />
  </head>
  <body>
    <aside class="info matrix-info">
      <img src="./eisenhower-matrix.jpg" alt="Eisenhower matrix diagram">
      <a class="info__link more-info" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </aside>
    <main class="todo todo-container">
      <h1 class="visually-hidden">Todo App</h1>

      <section id="add-task-section">
        <h2 class="visually-hidden">Add new task</h2>
        <label for="new-task" class="todo__label">Add Item</label>
        <div class="todo__row task-row">
          <input id="new-task" class="todo__input task" type="text">
          <button class="todo__btn">Add</button>
        </div>
      </section>

      <section>
        <h2 class="todo__title section-title">Todo</h2>
        <ul id="incomplete-tasks">
          <li class="todo__item task-item">
            <input type="checkbox">
            <label class="todo__text task">Pay Bills</label>
            <input type="text" class="todo__input task">
            <button class="todo__btn todo__btn--edit edit">Edit</button>
            <button class="todo__btn todo__btn--delete delete">
              <img src="./remove.svg" alt="Delete task">
            </button>
          </li>
          <li class="todo__item todo__item--editing task-item edit-mode">
            <input type="checkbox">
            <label class="todo__text task">Go Shopping</label>
            <input type="text" value="Go Shopping" class="todo__input task">
            <button class="todo__btn todo__btn--edit edit">Save</button>
            <button class="todo__btn todo__btn--delete delete">
              <img src="./remove.svg" alt="Delete task">
            </button>
          </li>
        </ul>
      </section>

        <section>
          <h2 class="todo__title section-title">Completed</h2>
          <ul id="completed-tasks">
            <li class="todo__item task-item">
              <input type="checkbox" checked>
              <label class="todo__text task">See the Doctor</label>
              <input type="text" class="todo__input task">
              <button class="todo__btn todo__btn--edit edit">Edit</button>
              <button class="todo__btn todo__btn--delete delete">
                <img src="./remove.svg" alt="Delete task">
              </button>
            </li>
          </ul>
        </section>
    </main>
    <script
      src="app.js">
    </script>
  </body>
</html>
